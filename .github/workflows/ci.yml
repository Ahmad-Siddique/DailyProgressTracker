name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      SUPABASE_SKIP: "1"
      PHASE0_AXE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm inventory && pnpm phase0:report
      - run: pnpm test:integration
      - run: pnpm build
      - run: pnpm exec playwright install chromium --with-deps
      - run: pnpm test:e2e